name: Bug report
description: Report a reproducible problem in the public Integration SDK or SQL Contract v1 path.
title: "[Bug] "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private keys, customer data, packet captures, unpublished device-protocol material or private Sadr Scales source. Security-sensitive reports must follow SECURITY.md instead of a public issue.

  - type: input
    id: version
    attributes:
      label: Integration version
      description: SDK version, GitHub Release tag or exact commit SHA.
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: sadr_version
    attributes:
      label: Sadr Scales version
      placeholder: 5.2.1
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Consumer runtime
      description: Example: .NET Framework 4.8, .NET 8, Raw SQL/Java.
      placeholder: .NET Framework 4.8
    validations:
      required: true

  - type: input
    id: sql_version
    attributes:
      label: SQL Server version
      description: If relevant to the problem.
      placeholder: SQL Server 2022

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the actual behavior and error in a concise, sanitized form.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Minimal steps using synthetic or sanitized data only.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional stack trace, schema validation output or logs after removing credentials/customer data/private material.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I ran Contract validation or explained why it could not be run.
          required: true
        - label: I reviewed the troubleshooting guide.
          required: true
        - label: This report contains no credentials, customer data or private device-protocol material.
          required: true
