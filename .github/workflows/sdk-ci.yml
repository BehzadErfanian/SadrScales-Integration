name: SDK CI

on:
  push:
    branches: [ main, 'm2/**' ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - '.github/workflows/sdk-ci.yml'

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/SadrScales.Integration.Tests/SadrScales.Integration.Tests.csproj

      - name: Build
        run: dotnet build tests/SadrScales.Integration.Tests/SadrScales.Integration.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/SadrScales.Integration.Tests/SadrScales.Integration.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Restore C# Quick Start
        run: dotnet restore samples/csharp/SadrScales.Integration.QuickStart/SadrScales.Integration.QuickStart.csproj

      - name: Build C# Quick Start
        run: dotnet build samples/csharp/SadrScales.Integration.QuickStart/SadrScales.Integration.QuickStart.csproj --configuration Release --no-restore

      - name: Pack SDK smoke test
        run: dotnet pack src/SadrScales.Integration/SadrScales.Integration.csproj --configuration Release --no-build --output artifacts/package

  sql-integration-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: SadrCi_Test_2026!
        ports:
          - 1433:1433

    env:
      # Disposable CI-only credential; never use this value outside the ephemeral GitHub runner.
      SADR_INTEGRATION_TEST_SQL: Server=localhost,1433;Database=master;User ID=sa;Password=SadrCi_Test_2026!;Encrypt=False;TrustServerCertificate=True

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore SQL integration tests
        run: dotnet restore tests/SadrScales.Integration.SqlTests/SadrScales.Integration.SqlTests.csproj

      - name: Build SQL integration tests
        run: dotnet build tests/SadrScales.Integration.SqlTests/SadrScales.Integration.SqlTests.csproj --configuration Release --no-restore

      - name: Test against disposable SQL Server 2022
        run: dotnet test tests/SadrScales.Integration.SqlTests/SadrScales.Integration.SqlTests.csproj --configuration Release --no-build --verbosity normal

  net48-package-consumer:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Pack SDK for consumer test
        run: dotnet pack src/SadrScales.Integration/SadrScales.Integration.csproj --configuration Release --output artifacts/package

      - name: Restore .NET Framework 4.8 consumer from local package
        run: dotnet restore tests/SadrScales.Integration.Net48Consumer/SadrScales.Integration.Net48Consumer.csproj --configfile tests/SadrScales.Integration.Net48Consumer/NuGet.CI.config

      - name: Build .NET Framework 4.8 consumer
        run: dotnet build tests/SadrScales.Integration.Net48Consumer/SadrScales.Integration.Net48Consumer.csproj --configuration Release --no-restore

      - name: Run .NET Framework 4.8 package compatibility smoke test
        shell: pwsh
        run: '& "tests\SadrScales.Integration.Net48Consumer\bin\Release\net48\SadrScales.Integration.Net48Consumer.exe"'
