name: SDK CI

on:
  push:
    branches: [ main, 'm2/**' ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/sdk-ci.yml'

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/SadrScales.Integration.Tests/SadrScales.Integration.Tests.csproj

      - name: Build
        run: dotnet build tests/SadrScales.Integration.Tests/SadrScales.Integration.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/SadrScales.Integration.Tests/SadrScales.Integration.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack SDK smoke test
        run: dotnet pack src/SadrScales.Integration/SadrScales.Integration.csproj --configuration Release --no-build --output artifacts/package
